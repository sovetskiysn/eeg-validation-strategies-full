name: classical_ml
transform:
  _target_: mne_features.feature_extraction.FeatureExtractor
  sfreq: ${preparation.mne_bids_pipeline_config.raw_resample_sfreq}
  # Fixed compact feature representation for Logistic Regression and XGBoost:
  # four spectral bands and five conventional statistical/entropy measures
  # per channel. The same extractor is used in every validation protocol.
  selected_funcs:
    - pow_freq_bands
    - samp_entropy
    - mean
    - variance
    - skewness
    - kurtosis
  params:
    pow_freq_bands__freq_bands:
      - [1.0, 4.0]
      - [4.0, 8.0]
      - [8.0, 13.0]
      - [13.0, 45.0]
    pow_freq_bands__log: true
