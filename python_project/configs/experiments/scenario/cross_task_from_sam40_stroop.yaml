# @package _global_

defaults:
  - /preparation@preparation.source: sam40
  - /preparation@preparation.targets.sam40_arithmetic: sam40
  - /preparation@preparation.targets.sam40_arithmetic_mirror: sam40
  - /preparation@preparation.targets.sam40_mirror: sam40
  - _self_
  - override /validation_strategy: cross_task
  - override /preparation: transfer

preparation:
  source:
    mne_bids_pipeline:
      task: [relax, stroop]
      deriv_root: ${..dataset_dir}/derivatives/mne-bids-pipeline/relax-stroop
  targets:
    sam40_arithmetic:
      mne_bids_pipeline:
        task: [relax, arithmetic]
        deriv_root: ${..dataset_dir}/derivatives/mne-bids-pipeline/relax-arithmetic
    sam40_arithmetic_mirror:
      mne_bids_pipeline:
        task: [relax, arithmetic, mirror]
        deriv_root: ${..dataset_dir}/derivatives/mne-bids-pipeline/relax-arithmetic-mirror
    sam40_mirror:
      mne_bids_pipeline:
        task: [relax, mirror]
        deriv_root: ${..dataset_dir}/derivatives/mne-bids-pipeline/relax-mirror
