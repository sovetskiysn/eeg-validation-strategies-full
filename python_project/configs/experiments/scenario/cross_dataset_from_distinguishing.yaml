# @package _global_

defaults:
  - /preparation@preparation.source: distinguishing
  - /preparation@preparation.targets.sam40_full: sam40
  - /preparation@preparation.targets.sam40_stroop: sam40
  - /preparation@preparation.targets.sam40_arithmetic: sam40
  - /preparation@preparation.targets.sam40_mirror: sam40
  - /preparation@preparation.targets.sam40_arithmetic_mirror: sam40
  - /preparation@preparation.targets.sam40_stroop_mirror: sam40
  - /preparation@preparation.targets.sam40_stroop_arithmetic: sam40
  - _self_
  - override /validation_strategy: cross_dataset
  - override /preparation: transfer

preparation:
  targets:
    sam40_full:
      mne_bids_pipeline:
        task: [relax, stroop, arithmetic, mirror]
    sam40_stroop:
      mne_bids_pipeline:
        task: [relax, stroop]
    sam40_arithmetic:
      mne_bids_pipeline:
        task: [relax, arithmetic]
    sam40_mirror:
      mne_bids_pipeline:
        task: [relax, mirror]
    sam40_arithmetic_mirror:
      mne_bids_pipeline:
        task: [relax, arithmetic, mirror]
    sam40_stroop_mirror:
      mne_bids_pipeline:
        task: [relax, stroop, mirror]
    sam40_stroop_arithmetic:
      mne_bids_pipeline:
        task: [relax, stroop, arithmetic]
