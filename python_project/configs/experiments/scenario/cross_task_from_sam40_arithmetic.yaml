# @package _global_

defaults:
  - /preparation@preparation.source: sam40
  - /preparation@preparation.targets.sam40_mirror: sam40
  - /preparation@preparation.targets.sam40_stroop: sam40
  - /preparation@preparation.targets.sam40_stroop_mirror: sam40
  - _self_
  - override /validation_strategy: cross_task
  - override /preparation: transfer

preparation:
  source:
    mne_bids_pipeline:
      task: [relax, arithmetic]
      deriv_root: ${..dataset_dir}/derivatives/mne-bids-pipeline/relax-arithmetic
  targets:
    sam40_mirror:
      mne_bids_pipeline:
        task: [relax, mirror]
        deriv_root: ${..dataset_dir}/derivatives/mne-bids-pipeline/relax-mirror
    sam40_stroop:
      mne_bids_pipeline:
        task: [relax, stroop]
        deriv_root: ${..dataset_dir}/derivatives/mne-bids-pipeline/relax-stroop
    sam40_stroop_mirror:
      mne_bids_pipeline:
        task: [relax, stroop, mirror]
        deriv_root: ${..dataset_dir}/derivatives/mne-bids-pipeline/relax-stroop-mirror
