# @package _global_

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      +experiments/scenario: glob(*)
      +experiments/decoder: glob(*)
  sweep:
    dir: results/scenario_decoder (${now:%Y-%m-%d %% %H-%M-%S})
    # Nested by the two swept axes, decoder/scenario, instead of the flat
    # `+experiments/decoder=...,+experiments/scenario=...` that
    # override_dirname produces.
    subdir: ${hydra:runtime.choices.experiments/decoder}/${hydra:runtime.choices.experiments/scenario}
