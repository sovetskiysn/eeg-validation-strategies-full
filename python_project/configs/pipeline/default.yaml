# One complete fitted estimator recipe. The default keeps direct single runs
# aligned with the full decoder sweep.
defaults:
  - 1_input_scaling@_global_.pipeline_components.input_scaling: none
  - 2_train_resampling@_global_.pipeline_components.train_resampling: none
  - 3_estimator@_global_.pipeline_components.model: logistic_regression
  - _self_

# This node is the complete estimator recipe.  The selected component groups
# stay outside this target so Hydra passes only positional pipeline steps to
# ``make_pipeline``.
_target_: imblearn.pipeline.make_pipeline
_args_:
  - ${pipeline_components.input_scaling.step}
  - ${pipeline_components.train_resampling.step}
  - ${pipeline_components.model.params}
