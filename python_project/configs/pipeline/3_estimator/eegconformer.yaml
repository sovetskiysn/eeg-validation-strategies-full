# @package pipeline_components.model
# Convolution plus self-attention EEG architecture (Song et al., 2022).
# Its larger capacity is deliberately compared with compact EEGNet rather than
# being treated as a replacement for the classical feature-based models.
name: eegconformer
params:
  _target_: braindecode.EEGClassifier
  module:
    _target_: hydra.utils.get_class
    path: braindecode.models.EEGConformer
  # The encoder is intentionally smaller than Braindecode's 6-layer, 10-head
  # default to keep repeated group-aware CV runs feasible on 12 x 640 windows.
  module__num_layers: 4
  module__num_heads: 8
  optimizer:
    _target_: hydra.utils.get_class
    path: torch.optim.AdamW
  max_epochs: 100
  batch_size: 64
  # Use the same conservative EEGClassifier optimisation recipe as the
  # Braindecode convolutional baselines. The smaller 4-layer/8-head encoder
  # above is retained because this study repeatedly fits 12 x 640 windows.
  lr: 0.000625
  optimizer__weight_decay: 0.0
  # Do not silently discard an entire small train fold (60 balanced windows in
  # cross-trial) merely because it is smaller than batch_size.
  iterator_train__drop_last: false
  callbacks:
    - _target_: skorch.callbacks.LRScheduler
      policy: CosineAnnealingLR
      T_max: 99
    - _target_: skorch.callbacks.EarlyStopping
      monitor: valid_loss
      patience: 10
      load_best: true
  device: cuda
  # Validation comes only from the corresponding outer train fold, never from
  # its held-out test fold.
  train_split:
    _target_: skorch.dataset.ValidSplit
    cv: 0.2
    stratified: true
    random_state: ${seed}
  verbose: 0
