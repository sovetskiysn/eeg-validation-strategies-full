# @package pipeline_components.model
name: logistic_regression
params:
  _target_: sklearn.linear_model.LogisticRegression
  random_state: ${seed}
  # Default max_iter=100 was too low: lbfgs was hitting the iteration cap
  # before reaching its own convergence tolerance (ConvergenceWarning),
  # so fitted weights depended on the cap rather than on the data.
  max_iter: 2000
  # L2 at the sklearn default strength. This is regularisation against
  # overfitting, not a hyperparameter search: LogisticRegressionCV tuned C via
  # an inner group-aware CV, but its inner split needed `groups` routed past
  # the train_resampling step (RandomOverSampler), which resamples X/y and not
  # the metadata routed alongside them -- the two are structurally
  # incompatible in this pipeline (imblearn.Pipeline._fit only resamples X, y
  # on a `fit_resample` step). Plain LogisticRegression sidesteps that: no
  # inner split, no groups needed here at all.
  C: 1.0
