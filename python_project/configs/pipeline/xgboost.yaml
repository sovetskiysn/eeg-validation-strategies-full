# One complete fitted estimator recipe for the tree-based classical decoder.
name: xgboost
estimator:
  _target_: imblearn.pipeline.make_pipeline
  _args_:
    # Tree splits are invariant to a positive linear rescaling of one feature, so
    # XGBoost needs no fitted input scaling.
    - passthrough
    # pipeline.BalancedXGBClassifier, not xgboost.XGBClassifier: a thin
    # subclass that adds the `class_weight` below, which XGBoost itself does not
    # have. Everything else on this estimator is the stock sklearn API.
    - _target_: pipeline.BalancedXGBClassifier
      random_state: ${seed}
      # Replaces the RandomOverSampler that used to precede this estimator, and
      # matches `class_weight: balanced` on the logistic regression and the
      # BalancedClassWeight callback on the three deep decoders -- one rebalancing
      # rule across all five. Computed from each train fold, which is what a
      # written-out number could not be: the imbalance is ~1:1 on distinguishing
      # and ~1:1, ~2:1 or ~3:1 on SAM40 depending on how many task conditions
      # selected SAM-40 tasks leave standing. XGBoost's own `scale_pos_weight`
      # is a single binary-only scalar and cannot follow that.
      class_weight: balanced
      tree_method: hist
      # CPU, not GPU: fold train sets here are ~2k rows x ~170 classical features
      # (baseline_sam40: 1920 train rows/fold). At that size XGBoost's per-round
      # host<->device transfer and kernel-launch overhead on `device: cuda`
      # dominates over the actual histogram compute, unlike the deep decoders
      # (eegnet/shallownet/eegconformer), which train on the raw window tensor and
      # are the ones the sweep machine's GPU (H200, see torch_num_threads comment
      # in configs/config.yaml) is actually sized for. `device`'s own default is
      # already `cpu` (xgboost.readthedocs.io/en/latest/parameter.html), so this
      # line is written out to say the choice is deliberate, not an oversight.
      device: cpu
      # Training folds have roughly 2k windows and ~170 features.  Shallower
      # trees, row/column subsampling and explicit L1/L2 penalties replace the
      # high-variance defaults (depth 6, rate 0.3, all rows and columns).  The
      # Fixed-recipe benchmark: each outer-train fold fits this predeclared
      # regularised ensemble for exactly 300 boosting rounds.
      n_estimators: 300
      learning_rate: 0.03
      max_depth: 3
      min_child_weight: 5
      subsample: 0.8
      colsample_bytree: 0.7
      reg_alpha: 0.1
      reg_lambda: 2.0
