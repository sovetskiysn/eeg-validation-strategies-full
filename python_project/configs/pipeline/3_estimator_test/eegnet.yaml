# @package pipeline_components.model
# One epoch and one filter per layer verify the deep-learning path quickly.
name: eegnet_test
params:
  _target_: braindecode.EEGClassifier
  module:
    _target_: hydra.utils.get_class
    path: braindecode.models.EEGNet
  module__F1: 1
  module__D: 1
  module__F2: 1
  module__kernel_length: 16
  module__depthwise_kernel_length: 8
  module__pool1_kernel_size: 8
  module__pool2_kernel_size: 16
  module__drop_prob: 0.0
  optimizer:
    _target_: hydra.utils.get_class
    path: torch.optim.AdamW
  max_epochs: 1
  # One full train fold fits in this batch, so one epoch is one optimiser step.
  batch_size: 16384
  lr: 1.0
  device: cuda
  train_split: null
  verbose: 0
