# The default Stage 1 recipe. Each component stays in its own numbered
# directory, while its package override places the component under a readable
# nested node of `cfg.preparation`.
defaults:
  - 1_preparation_version@provenance: version
  - 2_recording_selection@selection: selection
  - 3_signal_filtering@filtering: filtering
  - 4_ica_cleaning@ica: ica
  - 5_window_epoching@epoching: epoching
  - _self_
