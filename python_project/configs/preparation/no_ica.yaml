# Ablation counterpart to default.yaml: identical Stage-1 recipe, ICA step
# swapped for no_ica (see 5_ica_cleaning/no_ica.yaml). Kept as a full sibling
# recipe rather than a leaf-level override because BasicSweeper's override
# grammar rejects group names with a leading digit (5_ica_cleaning@... is
# only valid inside a defaults list, not as a CLI/sweep override).
defaults:
  - 1_preparation_version@provenance: version
  - 2_recording_selection@selection: selection
  - 3_signal_filtering@filtering: filtering
  - 4_signal_quality@quality: quality
  - 5_ica_cleaning@ica: no_ica
  - 6_window_epoching@epoching: epoching
  - _self_
