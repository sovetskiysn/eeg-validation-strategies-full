# Window geometry and common channels.
window_size: 5.0
overlap: 0.5
channels: [F3, F4, F7, F8, FC5, FC6, O1, O2, P7, P8, T7, T8]
# Peak-to-peak amplitude a window is allowed to reach on any channel before
# mne.Epochs drops it. ICA targets specific artefact topographies (blinks via
# the EOG-proxy channels); it does not catch every gross non-neural excursion
# (electrode pops, movement, cable faults). Left unset, such windows survive
# into training and test alike and dominate variance/entropy features.
reject_peak_to_peak_uv: 150.0
