
name: distinguishing
report_dir: _preparation/distinguishing
dataset_dir: datasets/bids/distinguishing

# This node alone is passed to MNE-BIDS-Pipeline after annotation-based type
# coercion in preparation.py. Omitted settings use Pipeline 1.10.1 defaults.
mne_bids_pipeline:
  bids_root: ${..dataset_dir}
  deriv_root: ${..dataset_dir}/derivatives/mne-bids-pipeline/attention
  allow_missing_sessions: true
  sessions: ['03', '04', '05', '06', '07']
  task: attention
  ch_types: [eeg]
  analyze_channels: [F3, F4, F7, F8, FC5, FC6, O1, O2, P7, P8, T7, T8]
  drop_channels: [AF3, AF4]
  eeg_reference: average
  l_freq: 1.0
  h_freq: 45.0
  notch_freq: [50.0]
  raw_resample_sfreq: 128.0
  # The source protocol orders every recording as focused (0–600 s),
  # unfocused (600–1200 s), then drowsy. Drowsiness includes eyes-closed and
  # arousal changes outside the study contrast, so remove it before filtering
  # and ICA rather than merely dropping its final analysis windows.
  crop_runs: [0.0, 1200.0]
  # Required by MNE-BIDS-Pipeline when task runs are treated as rest.
  epochs_tmin: 0.0
  rest_epochs_duration: 5.0
  rest_epochs_overlap: 0.5
  task_is_rest: true
  # Fixed-length rest epochs begin at t=0, so Pipeline's default (None, 0)
  # would contain only that one sample. Analysis windows have no prestimulus
  # baseline; the project creates their labelled windows from cleaned raw data.
  baseline: null
  spatial_filter: ica
  ica_algorithm: extended_infomax
  ica_exclusion_thresholds:
    eye blink: 0.8
    muscle artifact: 0.8
  ica_h_freq: 100.0
  ica_icalabel_include: [brain, other, heart beat, line noise, channel noise]
  ica_l_freq: 1.0
  ica_n_components: 0.99
  # Keep the ICA recipe identical across datasets. Short recordings may leave
  # AutoReject with no epochs for fitting; ICA-label remains enabled below.
  ica_reject: null
  ica_use_icalabel: true
  run_source_estimation: false
