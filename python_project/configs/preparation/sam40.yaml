
name: sam40
dataset_dir: datasets/bids/sam40

# Scenarios override only `mne_bids_pipeline.task`; its value is the complete
# SAM-40 composition and must include relax.
mne_bids_pipeline:
  bids_root: ${..dataset_dir}
  deriv_root: ${..dataset_dir}/derivatives/mne-bids-pipeline/relax-stroop-arithmetic-mirror
  task: [relax, stroop, arithmetic, mirror]
  ch_types: [eeg]
  analyze_channels: [F3, F4, F7, F8, FC5, FC6, O1, O2, P7, P8, T7, T8]
  drop_channels: [CZ, FZ, Fp1, FC1, C3, FT9, CP5, CP1, P3, PO9, PZ, OZ, PO10, P4, CP2, CP6, FT10, C4, FC2, Fp2]
  eeg_reference: average
  l_freq: 1.0
  h_freq: 40.0
  notch_freq: [50.0]
  raw_resample_sfreq: 128.0
  # Multiple task names require the task-keyed contrasts form, even when no
  # evoked contrasts are requested. An empty mapping remains valid for every
  # scenario-specific subset of tasks.
  contrasts: {}
  # Required by MNE-BIDS-Pipeline when task runs are treated as rest.
  epochs_tmin: 0.0
  rest_epochs_duration: 5.0
  rest_epochs_overlap: 0.5
  task_is_rest: true
  spatial_filter: ica
  ica_algorithm: extended_infomax
  ica_exclusion_thresholds:
    eye blink: 0.8
    muscle artifact: 0.8
  ica_h_freq: 100.0
  ica_icalabel_include: [brain, other, heart beat, line noise, channel noise]
  ica_l_freq: 1.0
  ica_n_components: 0.99
  # Each task contains only three short runs. On sub-21/mirror AutoReject
  # rejected all 18 fitting epochs, which makes ICA impossible to fit and
  # aborts the whole sweep. Fit ICA on the filtered continuous recording;
  # ICA-label still excludes non-neural components afterwards.
  ica_reject: null
  ica_use_icalabel: true
  run_source_estimation: false
