# Condition-blind raw-signal QC before average reference and ICA.  MNE's
# annotate_amplitude detects sustained sample-to-sample jumps or flatlines;
# LOF independently identifies a spatially atypical channel.  Both methods
# operate only on EEG signal quality, never on the experimental label.
peak_uv: 150.0
flat_uv: 0.0
min_duration_s: 0.5
bad_percent: 5.0
# The common transfer space has only 12 channels.  Five neighbours made LOF
# mistake normal frontal-versus-posterior signal differences in DSTI for bad
# channels; ten is the empirically conservative neighbourhood on both releases.
lof_n_neighbors: 10
lof_threshold: 1.5

# One automatically detected channel can be interpolated conservatively while
# retaining the fixed 12-channel transfer space.  More than one is an explicit
# QC failure, not a silent, increasingly synthetic reconstruction.
max_auto_bad_channels: 1
