# Bump this when Stage 1 code changes in a way the YAML parameters cannot
# describe. It versions filtering, selection, ICA and epoching together, and
# therefore forces a new content-addressed Epochs artifact.
#
# DATASET_MAPPING in src/preparation.py is exactly such a change: the full
# condition -> class mapping lives in code, so editing it changes the artifact
# without changing the hash that addresses it. Renaming a class counts too: the
# name is written into the `event_id` of the Epochs file itself. It is available
# as `preparation.provenance.version` after Hydra composition.
version: epochs_dataset_v8
