# Transfer has no default source or target: a scenario recipe selects the source
# with a Hydra group override and lists its targets literally. Cross-task uses
# the same dataset on both sides and gives each side its own complete
# `exclude_conditions` list.
#
# One source is checked against several targets in one run, so `targets` is a
# list of complete dataset recipes rather than a composed group: Hydra composes
# one option per package, and the number of directions is a property of the
# scenario. Each entry repeats the two keys of a `configs/dataset/` option --
# they are what addresses the Stage 1 artifact, so a forgotten
# `exclude_conditions` builds a different cohort under a different hash.
#
# `name` says only where the run trains, because a run with several targets has
# no single direction to name: the readable name of a direction is assembled by
# the analysis from the recipe it saved. It is a label and nothing else -- on
# every other `configs/dataset/` option `name` addresses a BIDS release, but the
# ones addressing data here are `source.name` and each `targets[i].name`.
defaults:
  - /dataset@source: ???
  - _self_

name: from-${dataset.source.name}
targets: ???
