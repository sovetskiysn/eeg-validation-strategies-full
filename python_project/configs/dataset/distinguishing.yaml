name: distinguishing

# Полная разметка релиза (unfocused и drowsy — один класс, focused — другой)
# живёт константой DATASET_MAPPING в src/preparation.py. Здесь — плоский
# список имён, которые из неё вычитаются, и ничего больше.
#
# drowsy исключён по умолчанию: сон и сфокусированное внимание не образуют одну
# бинарную задачу с unfocused, поэтому основной анализ — unfocused против
# focused. Scenario-рецепт может вернуть полный состав пустым списком
# исключений.
exclude_conditions: [drowsy]
