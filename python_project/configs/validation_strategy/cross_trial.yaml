name: cross_trial
# Leave-one-trial-out внутри субъекта. Все окна и все выбранные task-записи
# одного source trial остаются на одной стороне сплита: это защищает от leakage
# между перекрывающимися окнами и повторными acquisitions, но переносимость
# между независимыми физическими сессиями не проверяет и так называться не должно.
protocol:
  _target_: validation.build_cross_trial
