# @package _global_

defaults:
  - override /validation_strategy: cross_dataset
  - override /dataset@dataset.source: distinguishing

dataset:
  targets:
    - name: sam40
      exclude_conditions: []
    - name: sam40
      exclude_conditions: [arithmetic, mirror]
    - name: sam40
      exclude_conditions: [stroop, mirror]
    - name: sam40
      exclude_conditions: [stroop, arithmetic]
