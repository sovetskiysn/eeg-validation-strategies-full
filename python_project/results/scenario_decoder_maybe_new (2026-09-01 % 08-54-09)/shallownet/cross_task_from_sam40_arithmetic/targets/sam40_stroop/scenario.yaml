validation_strategy:
  name: cross_task
preparation:
  source:
    name: sam40_arithmetic
    dataset_dir: datasets/bids/sam40
    save_preparation_html_reports: false
    mne_bids_pipeline_config:
      bids_root: datasets/bids/sam40
      ch_types:
      - eeg
      analyze_channels:
      - F3
      - F4
      - F7
      - F8
      - FC5
      - FC6
      - O1
      - O2
      - P7
      - P8
      - T7
      - T8
      drop_channels:
      - CZ
      - FZ
      - Fp1
      - FC1
      - C3
      - FT9
      - CP5
      - CP1
      - P3
      - PO9
      - PZ
      - OZ
      - PO10
      - P4
      - CP2
      - CP6
      - FT10
      - C4
      - FC2
      - Fp2
      eeg_reference: average
      l_freq: 1.0
      h_freq: 45.0
      notch_freq:
      - 50.0
      raw_resample_sfreq: 128.0
      contrasts: {}
      epochs_tmin: 0.0
      rest_epochs_duration: 5.0
      rest_epochs_overlap: 0.5
      task_is_rest: true
      baseline: null
      spatial_filter: ica
      ica_algorithm: picard-extended_infomax
      ica_decim: 2
      ica_exclusion_thresholds:
        eye blink: 0.8
        muscle artifact: 0.8
      ica_h_freq: 100.0
      ica_icalabel_include:
      - brain
      - other
      - heart beat
      - line noise
      - channel noise
      ica_l_freq: 1.0
      ica_n_components: 0.99
      ica_reject: null
      ica_use_icalabel: true
      n_jobs: 4
      run_source_estimation: false
      task:
      - relax
      - arithmetic
      deriv_root: datasets/bids/sam40/derivatives/mne-bids-pipeline/relax-arithmetic
