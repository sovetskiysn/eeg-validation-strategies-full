hydra:
  run:
    dir: results/default_run (${now:%Y-%m-%d %% %H-%M-%S})
  sweep:
    dir: results/baseline_logistic_regression (${now:%Y-%m-%d %% %H-%M-%S})
    subdir: ${hydra:runtime.choices.experiments/decoder}/${hydra:runtime.choices.experiments/scenario}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params:
      +experiments/scenario: baseline_distinguishing,baseline_sam40_all
      +experiments/decoder: logistic_regression
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks:
    log_job_return:
      _target_: hydra.experimental.callbacks.LogJobReturnCallback
  output_subdir: .hydra
  overrides:
    hydra:
    - ~hydra.callbacks.hardware_trace
    task:
    - +experiments=baseline_logistic_regression
  job:
    name: adhoc
    chdir: false
    override_dirname: +experiments=baseline_logistic_regression
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.5
    version_base: '1.3'
    cwd: /home/svc-jax-dlh/.work/python_project
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/svc-jax-dlh/.work/python_project/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: ???
    choices:
      experiments: baseline_logistic_regression
      validation_strategy: baseline
      pipeline: logistic_regression
      features: classical_ml
      preparation: sam40
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
preparation:
  name: sam40
  dataset_dir: datasets/bids/sam40
  mne_bids_pipeline:
    bids_root: ${..dataset_dir}
    deriv_root: ${..dataset_dir}/derivatives/mne-bids-pipeline
    task:
    - relax
    - stroop
    - arithmetic
    - mirror
    ch_types:
    - eeg
    analyze_channels:
    - F3
    - F4
    - F7
    - F8
    - FC5
    - FC6
    - O1
    - O2
    - P7
    - P8
    - T7
    - T8
    drop_channels:
    - CZ
    - FZ
    - Fp1
    - FC1
    - C3
    - FT9
    - CP5
    - CP1
    - P3
    - PO9
    - PZ
    - OZ
    - PO10
    - P4
    - CP2
    - CP6
    - FT10
    - C4
    - FC2
    - Fp2
    eeg_reference: average
    l_freq: 1.0
    h_freq: 40.0
    notch_freq:
    - 50.0
    raw_resample_sfreq: 128.0
    contrasts: {}
    epochs_tmin: 0.0
    rest_epochs_duration: 5.0
    rest_epochs_overlap: 0.5
    task_is_rest: true
    spatial_filter: ica
    ica_algorithm: extended_infomax
    ica_exclusion_thresholds:
      eye blink: 0.8
      muscle artifact: 0.8
    ica_h_freq: 100.0
    ica_icalabel_include:
    - brain
    - other
    - heart beat
    - line noise
    - channel noise
    ica_l_freq: 1.0
    ica_n_components: 0.99
    ica_reject: autoreject_local
    ica_use_icalabel: true
    autoreject_n_interpolate:
    - 1
    run_source_estimation: false
features:
  name: classical_ml
  transform:
    _target_: mne_features.feature_extraction.FeatureExtractor
    sfreq: null
    selected_funcs:
    - pow_freq_bands
    - samp_entropy
    - mean
    - variance
    - skewness
    - kurtosis
    params:
      pow_freq_bands__freq_bands:
      - - 1.0
        - 4.0
      - - 4.0
        - 8.0
      - - 8.0
        - 13.0
      - - 13.0
        - 40.0
      pow_freq_bands__log: true
pipeline:
  name: logistic_regression
  estimator:
    _target_: imblearn.pipeline.make_pipeline
    _args_:
    - _target_: sklearn.preprocessing.StandardScaler
    - _target_: sklearn.linear_model.LogisticRegression
      random_state: ${seed}
      max_iter: 2000
      C: 1.0
      class_weight: balanced
      solver: newton-cholesky
      l1_ratio: 0.0
validation_strategy:
  name: baseline
  protocol:
    _target_: validation.build_baseline
seed: 42
torch_num_threads: 6
