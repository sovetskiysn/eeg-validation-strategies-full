preparation:
  name: sam40_arithmetic
  dataset_dir: datasets/bids/sam40
  mne_bids_pipeline:
    bids_root: datasets/bids/sam40
    ch_types:
    - eeg
    analyze_channels:
    - F3
    - F4
    - F7
    - F8
    - FC5
    - FC6
    - O1
    - O2
    - P7
    - P8
    - T7
    - T8
    drop_channels:
    - CZ
    - FZ
    - Fp1
    - FC1
    - C3
    - FT9
    - CP5
    - CP1
    - P3
    - PO9
    - PZ
    - OZ
    - PO10
    - P4
    - CP2
    - CP6
    - FT10
    - C4
    - FC2
    - Fp2
    eeg_reference: average
    l_freq: 1.0
    h_freq: 45.0
    notch_freq:
    - 50.0
    raw_resample_sfreq: 128.0
    contrasts: {}
    epochs_tmin: 0.0
    rest_epochs_duration: 5.0
    rest_epochs_overlap: 0.5
    task_is_rest: true
    baseline: null
    spatial_filter: ica
    ica_algorithm: picard-extended_infomax
    ica_decim: 2
    ica_exclusion_thresholds:
      eye blink: 0.8
      muscle artifact: 0.8
    ica_h_freq: 100.0
    ica_icalabel_include:
    - brain
    - other
    - heart beat
    - line noise
    - channel noise
    ica_l_freq: 1.0
    ica_n_components: 0.99
    ica_reject: null
    ica_use_icalabel: true
    n_jobs: 4
    run_source_estimation: false
    task:
    - relax
    - arithmetic
    deriv_root: datasets/bids/sam40/derivatives/mne-bids-pipeline/relax-arithmetic
features:
  name: classical_ml
  transform:
    _target_: mne_features.feature_extraction.FeatureExtractor
    sfreq: 128.0
    selected_funcs:
    - pow_freq_bands
    - samp_entropy
    - mean
    - variance
    - skewness
    - kurtosis
    params:
      pow_freq_bands__freq_bands:
      - - 1.0
        - 4.0
      - - 4.0
        - 8.0
      - - 8.0
        - 13.0
      - - 13.0
        - 45.0
      pow_freq_bands__log: true
pipeline:
  name: xgboost
  estimator:
    _target_: imblearn.pipeline.make_pipeline
    _args_:
    - passthrough
    - _target_: pipeline.BalancedXGBClassifier
      random_state: 42
      class_weight: balanced
      tree_method: hist
      device: cpu
      n_estimators: 300
      learning_rate: 0.03
      max_depth: 3
      min_child_weight: 5
      subsample: 0.8
      colsample_bytree: 0.7
      reg_alpha: 0.1
      reg_lambda: 2.0
validation_strategy:
  name: baseline
  protocol:
    _target_: validation.build_baseline
seed: 42
torch_num_threads: 12
