hydra:
  run:
    dir: results/default_run (${now:%Y-%m-%d %% %H-%M-%S})
  sweep:
    dir: results/scenario_decoder_maybe_new (${now:%Y-%m-%d %% %H-%M-%S})
    subdir: ${hydra:runtime.choices.experiments/decoder}/${hydra:runtime.choices.experiments/scenario_maybe_new}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params:
      +experiments/scenario_maybe_new: glob(*)
      +experiments/decoder: glob(*)
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks:
    hardware_trace:
      _target_: hydra_setup.HardwareTraceCallback
    log_job_return:
      _target_: hydra.experimental.callbacks.LogJobReturnCallback
  output_subdir: .hydra
  overrides:
    hydra: []
    task:
    - +experiments/scenario_maybe_new=cross_subject_distinguishing
    - +experiments/decoder=shallownet
    - +experiments=scenario_decoder_maybe_new
  job:
    name: adhoc
    chdir: false
    override_dirname: +experiments/decoder=shallownet,+experiments/scenario_maybe_new=cross_subject_distinguishing,+experiments=scenario_decoder_maybe_new
    id: '58'
    num: 58
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.5
    version_base: '1.3'
    cwd: /work/python_project
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /work/python_project/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /work/python_project/results/scenario_decoder_maybe_new (2026-09-01
      % 08-54-09)/shallownet/cross_subject_distinguishing
    choices:
      experiments: scenario_decoder_maybe_new
      experiments/decoder: shallownet
      experiments/scenario_maybe_new: cross_subject_distinguishing
      validation_strategy: cross_subject
      pipeline: shallownet
      features: deep_learning
      preparation: distinguishing
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
