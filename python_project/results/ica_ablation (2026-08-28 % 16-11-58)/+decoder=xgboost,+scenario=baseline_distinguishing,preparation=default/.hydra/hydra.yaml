hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: results/${hydra.job.config_name} (${now:%Y-%m-%d %% %H-%M-%S})
    subdir: ${hydra.job.override_dirname}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params:
      +scenario: baseline_sam40,cross_subject_sam40,baseline_distinguishing
      +decoder: logistic_regression,xgboost
      preparation: default,no_ica
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks:
    hardware_trace:
      _target_: hydra_setup.HardwareTraceCallback
    log_job_return:
      _target_: hydra.experimental.callbacks.LogJobReturnCallback
  output_subdir: .hydra
  overrides:
    hydra: []
    task:
    - +scenario=baseline_distinguishing
    - +decoder=xgboost
    - preparation=default
  job:
    name: run_experiment
    chdir: false
    override_dirname: +decoder=xgboost,+scenario=baseline_distinguishing,preparation=default
    id: '10'
    num: 10
    config_name: ica_ablation
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.5
    version_base: '1.3'
    cwd: /home/svc-jax-dlh/.work/python_project
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/svc-jax-dlh/.work/python_project/configs
      schema: file
      provider: main
    - path: /home/svc-jax-dlh/.work/python_project/experiments
      schema: file
      provider: command-line
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/svc-jax-dlh/.work/python_project/results/ica_ablation (2026-08-28
      % 16-11-58)/+decoder=xgboost,+scenario=baseline_distinguishing,preparation=default
    choices:
      decoder: xgboost
      scenario: baseline_distinguishing
      validation_strategy: baseline
      pipeline: default
      pipeline/3_estimator@pipeline_components.model: xgboost
      pipeline/2_train_resampling@pipeline_components.train_resampling: classical_oversampling
      pipeline/1_input_scaling@pipeline_components.input_scaling: none
      features: classical_ml
      preparation: default
      preparation/6_window_epoching@preparation.epoching: epoching
      preparation/5_ica_cleaning@preparation.ica: ica
      preparation/4_signal_quality@preparation.quality: quality
      preparation/3_signal_filtering@preparation.filtering: filtering
      preparation/2_recording_selection@preparation.selection: selection
      preparation/1_preparation_version@preparation.provenance: version
      dataset: distinguishing
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
