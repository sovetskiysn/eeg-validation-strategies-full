dataset:
  source:
    name: sam40
    exclude_conditions:
    - mirror
  name: from-${dataset.source.name}
  targets:
  - name: sam40
    exclude_conditions:
    - stroop
    - arithmetic
preparation:
  provenance:
    version: epochs_dataset_v11
  selection:
    exclude_session_values:
      session_role:
      - habituation
      session_quality: []
    exclude_run_values:
      filename: []
      acq_time: []
      source: []
  filtering:
    l_freq: 1.0
    h_freq: 40.0
    notch_frequencies:
    - 50.0
    reference: average
    resample_sfreq: 128.0
  quality:
    peak_uv: 150.0
    flat_uv: 0.0
    min_duration_s: 0.5
    bad_percent: 5.0
    lof_n_neighbors: 10
    lof_threshold: 1.5
    max_auto_bad_channels: 1
  ica:
    ica_method: fastica
    ica_n_components: 0.99
    ica_random_state: ${seed}
    ica_fit_l_freq: 1.0
    ica_fit_h_freq: 40.0
    ica_eog_proxy_channels:
    - F3
    - F4
    - F7
    - F8
    ica_eog_threshold: 2.4
  epoching:
    window_size: 5.0
    overlap: 0.5
    channels:
    - F3
    - F4
    - F7
    - F8
    - FC5
    - FC6
    - O1
    - O2
    - P7
    - P8
    - T7
    - T8
    reject_peak_to_peak_uv: 150.0
features:
  name: classical_ml
  transform:
    _target_: mne_features.feature_extraction.FeatureExtractor
    sfreq: ${preparation.filtering.resample_sfreq}
    selected_funcs:
    - pow_freq_bands
    - samp_entropy
    - mean
    - variance
    - skewness
    - kurtosis
    params:
      pow_freq_bands__freq_bands:
      - - 1.0
        - 4.0
      - - 4.0
        - 8.0
      - - 8.0
        - 13.0
      - - 13.0
        - 40.0
      pow_freq_bands__log: true
pipeline_components:
  input_scaling:
    step: passthrough
  train_resampling:
    step:
      _target_: imblearn.over_sampling.RandomOverSampler
      random_state: ${seed}
  model:
    name: xgboost
    params:
      _target_: xgboost.XGBClassifier
      random_state: ${seed}
      tree_method: hist
      device: cpu
pipeline:
  _target_: imblearn.pipeline.make_pipeline
  _args_:
  - ${pipeline_components.input_scaling.step}
  - ${pipeline_components.train_resampling.step}
  - ${pipeline_components.model.params}
validation_strategy:
  name: cross_task
  protocol:
    _target_: validation.build_cross_task
seed: 42
torch_num_threads: 6
