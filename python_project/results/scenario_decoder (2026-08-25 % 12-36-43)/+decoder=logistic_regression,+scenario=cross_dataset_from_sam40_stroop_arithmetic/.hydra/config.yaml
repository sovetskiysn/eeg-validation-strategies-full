dataset:
  source:
    name: sam40
    exclude_conditions:
    - mirror
  name: from-${dataset.source.name}
  targets:
  - name: distinguishing
    exclude_conditions:
    - drowsy
preparation:
  provenance:
    version: epochs_dataset_v8
  selection:
    exclude_session_values:
      session_role:
      - habituation
      session_quality: []
    exclude_run_values:
      filename: []
      acq_time: []
      source: []
  filtering:
    l_freq: 0.5
    h_freq: 45.0
    notch_frequencies:
    - 50.0
    reference: average
    resample_sfreq: 128.0
  ica:
    ica_method: fastica
    ica_n_components: 0.99
    ica_random_state: ${seed}
    ica_fit_l_freq: 1.0
    ica_fit_h_freq: 45.0
    ica_eog_proxy_channels:
    - F3
    - F4
    - F7
    - F8
    ica_eog_threshold: 2.4
  epoching:
    window_size: 5.0
    overlap: 0.5
    channels:
    - F3
    - F4
    - F7
    - F8
    - FC5
    - FC6
    - O1
    - O2
    - P7
    - P8
    - T7
    - T8
features:
  name: classical_ml
  transform:
    _target_: mne_features.feature_extraction.FeatureExtractor
    sfreq: ${preparation.filtering.resample_sfreq}
    selected_funcs:
    - pow_freq_bands
    - spect_entropy
    - app_entropy
    - samp_entropy
    - svd_entropy
    - mean
    - std
    - variance
    - skewness
    - kurtosis
    params:
      pow_freq_bands__freq_bands:
      - - 0.5
        - 4.0
      - - 4.0
        - 8.0
      - - 8.0
        - 13.0
      - - 13.0
        - 30.0
      - - 30.0
        - 45.0
      pow_freq_bands__log: true
    n_jobs: ${feature_n_jobs}
pipeline_components:
  input_scaling:
    step:
      _target_: sklearn.preprocessing.StandardScaler
  train_resampling:
    step:
      _target_: imblearn.over_sampling.RandomOverSampler
      random_state: ${seed}
  model:
    name: logistic_regression
    params:
      _target_: sklearn.linear_model.LogisticRegression
      random_state: ${seed}
pipeline:
  _target_: imblearn.pipeline.make_pipeline
  _args_:
  - ${pipeline_components.input_scaling.step}
  - ${pipeline_components.train_resampling.step}
  - ${pipeline_components.model.params}
validation_strategy:
  name: cross_dataset
  protocol:
    _target_: validation.build_cross_dataset
seed: 42
feature_n_jobs: 8
torch_num_threads: 4
