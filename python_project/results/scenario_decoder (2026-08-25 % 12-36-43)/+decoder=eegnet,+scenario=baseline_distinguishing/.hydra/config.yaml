dataset:
  name: distinguishing
  exclude_conditions:
  - drowsy
preparation:
  provenance:
    version: epochs_dataset_v8
  selection:
    exclude_session_values:
      session_role:
      - habituation
      session_quality: []
    exclude_run_values:
      filename: []
      acq_time: []
      source: []
  filtering:
    l_freq: 0.5
    h_freq: 45.0
    notch_frequencies:
    - 50.0
    reference: average
    resample_sfreq: 128.0
  ica:
    ica_method: fastica
    ica_n_components: 0.99
    ica_random_state: ${seed}
    ica_fit_l_freq: 1.0
    ica_fit_h_freq: 45.0
    ica_eog_proxy_channels:
    - F3
    - F4
    - F7
    - F8
    ica_eog_threshold: 2.4
  epoching:
    window_size: 5.0
    overlap: 0.5
    channels:
    - F3
    - F4
    - F7
    - F8
    - FC5
    - FC6
    - O1
    - O2
    - P7
    - P8
    - T7
    - T8
features:
  name: deep_learning
  transform:
    _target_: sklearn.preprocessing.FunctionTransformer
    validate: false
pipeline_components:
  input_scaling:
    step:
      _target_: sklearn.preprocessing.FunctionTransformer
      func:
        _target_: functools.partial
        _args_:
        - _target_: hydra.utils.get_method
          path: numpy.multiply
        - 1000000.0
      validate: false
  train_resampling:
    step:
      _target_: imblearn.FunctionSampler
      _convert_: all
      validate: false
      func:
        _target_: hydra.utils.get_method
        path: pipeline.resample_eeg_train_windows
      kw_args:
        random_state: ${seed}
  model:
    name: eegnet
    params:
      _target_: braindecode.EEGClassifier
      module:
        _target_: hydra.utils.get_class
        path: braindecode.models.EEGNet
      module__drop_prob: 0.5
      optimizer:
        _target_: hydra.utils.get_class
        path: torch.optim.AdamW
      max_epochs: 100
      batch_size: 64
      lr: 0.001
      optimizer__weight_decay: 0.0001
      device: cuda
      train_split: null
      verbose: 0
pipeline:
  _target_: imblearn.pipeline.make_pipeline
  _args_:
  - ${pipeline_components.input_scaling.step}
  - ${pipeline_components.train_resampling.step}
  - ${pipeline_components.model.params}
validation_strategy:
  name: baseline
  protocol:
    _target_: validation.build_baseline
seed: 42
feature_n_jobs: 8
torch_num_threads: 4
