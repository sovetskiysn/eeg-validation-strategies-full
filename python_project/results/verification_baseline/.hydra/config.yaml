features:
  name: classical_ml
  transform:
    _target_: mne_features.feature_extraction.FeatureExtractor
    sfreq: ${preparation.sampling_frequency}
    selected_funcs:
    - pow_freq_bands
    - samp_entropy
    - mean
    - variance
    - skewness
    - kurtosis
    params:
      pow_freq_bands__freq_bands:
      - - 1.0
        - 4.0
      - - 4.0
        - 8.0
      - - 8.0
        - 13.0
      - - 13.0
        - 40.0
      pow_freq_bands__log: true
pipeline:
  name: logistic_regression
  estimator:
    _target_: imblearn.pipeline.make_pipeline
    _args_:
    - _target_: sklearn.preprocessing.StandardScaler
    - _target_: sklearn.linear_model.LogisticRegression
      random_state: ${seed}
      max_iter: 2000
      C: 1.0
      class_weight: balanced
      solver: newton-cholesky
      l1_ratio: 0.0
validation_strategy:
  name: baseline
  protocol:
    _target_: validation.build_baseline
seed: 42
torch_num_threads: 6
