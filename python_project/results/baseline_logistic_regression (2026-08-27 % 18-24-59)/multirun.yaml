hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: results/${hydra.job.config_name} (${now:%Y-%m-%d %% %H-%M-%S})
    subdir: ${hydra.job.override_dirname}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params:
      +scenario: baseline_distinguishing,baseline_sam40
      +decoder: logistic_regression
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra: []
    task: []
  job:
    name: run_experiment
    chdir: false
    override_dirname: ''
    id: ???
    num: ???
    config_name: baseline_logistic_regression
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.5
    version_base: '1.3'
    cwd: /home/svc-jax-dlh/.work/python_project
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/svc-jax-dlh/.work/python_project/configs
      schema: file
      provider: main
    - path: /home/svc-jax-dlh/.work/python_project/experiments
      schema: file
      provider: command-line
    - path: ''
      schema: structured
      provider: schema
    output_dir: ???
    choices:
      validation_strategy: baseline
      pipeline: default
      pipeline/3_estimator@pipeline_components.model: logistic_regression
      pipeline/2_train_resampling@pipeline_components.train_resampling: none
      pipeline/1_input_scaling@pipeline_components.input_scaling: none
      features: classical_ml
      preparation: default
      preparation/5_window_epoching@preparation.epoching: epoching
      preparation/4_ica_cleaning@preparation.ica: ica
      preparation/3_signal_filtering@preparation.filtering: filtering
      preparation/2_recording_selection@preparation.selection: selection
      preparation/1_preparation_version@preparation.provenance: version
      dataset: sam40
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
dataset:
  name: sam40
  exclude_conditions: []
preparation:
  provenance:
    version: epochs_dataset_v9
  selection:
    exclude_session_values:
      session_role:
      - habituation
      session_quality: []
    exclude_run_values:
      filename: []
      acq_time: []
      source: []
  filtering:
    l_freq: 0.5
    h_freq: 45.0
    notch_frequencies:
    - 50.0
    reference: average
    resample_sfreq: 128.0
  ica:
    ica_method: fastica
    ica_n_components: 0.99
    ica_random_state: ${seed}
    ica_fit_l_freq: 1.0
    ica_fit_h_freq: 45.0
    ica_eog_proxy_channels:
    - F3
    - F4
    - F7
    - F8
    ica_eog_threshold: 2.4
  epoching:
    window_size: 5.0
    overlap: 0.5
    channels:
    - F3
    - F4
    - F7
    - F8
    - FC5
    - FC6
    - O1
    - O2
    - P7
    - P8
    - T7
    - T8
features:
  name: classical_ml
  transform:
    _target_: mne_features.feature_extraction.FeatureExtractor
    sfreq: ${preparation.filtering.resample_sfreq}
    selected_funcs:
    - pow_freq_bands
    - spect_entropy
    - app_entropy
    - samp_entropy
    - svd_entropy
    - mean
    - std
    - variance
    - skewness
    - kurtosis
    params:
      pow_freq_bands__freq_bands:
      - - 0.5
        - 4.0
      - - 4.0
        - 8.0
      - - 8.0
        - 13.0
      - - 13.0
        - 30.0
      - - 30.0
        - 45.0
      pow_freq_bands__log: true
    n_jobs: ${feature_n_jobs}
pipeline_components:
  input_scaling:
    step: passthrough
  train_resampling:
    step: passthrough
  model:
    name: logistic_regression
    params:
      _target_: sklearn.linear_model.LogisticRegression
      random_state: ${seed}
pipeline:
  _target_: imblearn.pipeline.make_pipeline
  _args_:
  - ${pipeline_components.input_scaling.step}
  - ${pipeline_components.train_resampling.step}
  - ${pipeline_components.model.params}
validation_strategy:
  name: baseline
  protocol:
    _target_: validation.build_baseline
seed: 42
feature_n_jobs: 1
torch_num_threads: 1
