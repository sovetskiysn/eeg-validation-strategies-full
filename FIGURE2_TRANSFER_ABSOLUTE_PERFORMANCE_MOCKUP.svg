<svg xmlns="http://www.w3.org/2000/svg" width="2182" height="625" viewBox="0 235 2182 625">
  <defs>
    <style>
      .title { font: 700 39px Arial, Helvetica, sans-serif; fill:#18202a; }
      .subtitle { font: 23px Arial, Helvetica, sans-serif; fill:#4e5b68; }
      .axis { font: 700 24px Arial, Helvetica, sans-serif; fill:#263341; }
      .label { font: 24px Arial, Helvetica, sans-serif; fill:#263341; }
      .small { font: 20px Arial, Helvetica, sans-serif; fill:#53616f; }
      .cell { font: 700 25px Arial, Helvetica, sans-serif; fill:#fff; }
      .cellDark { font: 700 25px Arial, Helvetica, sans-serif; fill:#263341; }
      .note { font: 21px Arial, Helvetica, sans-serif; fill:#3c4b59; }
    </style>
    <linearGradient id="scale" x1="0" y1="1" x2="0" y2="0">
      <!-- Warm sequential scale. White remains reserved for the baseline diagonal. -->
      <stop offset="0%" stop-color="#f5d8d2"/>
      <stop offset="25%" stop-color="#eeaea3"/>
      <stop offset="50%" stop-color="#df7669"/>
      <stop offset="75%" stop-color="#c84f48"/>
      <stop offset="100%" stop-color="#8d1327"/>
    </linearGradient>
  </defs>

  <rect width="2182" height="860" fill="#ffffff"/>
  <g class="label" text-anchor="middle">
    <text x="650" y="270">Stroop</text><text x="820" y="270">Arithmetic</text><text x="990" y="270">Mirror</text><text x="1160" y="270">Full A</text><text x="1330" y="270">Full B</text>
    <text x="1650" y="270">Mean cross-task Δ</text><text x="1930" y="270">Mean cross-dataset Δ</text>
  </g>
  <g class="label" text-anchor="end">
    <text x="530" y="365">Stroop</text><text x="530" y="465">Arithmetic</text><text x="530" y="565">Mirror</text><text x="530" y="665">Full A</text><text x="530" y="765">Full B</text>
  </g>

  <!-- Grid backgrounds -->
  <g fill="#f2f4f6" stroke="#ffffff" stroke-width="6">
    <rect x="565" y="310" width="170" height="100"/><rect x="735" y="310" width="170" height="100"/><rect x="905" y="310" width="170" height="100"/><rect x="1075" y="310" width="170" height="100"/><rect x="1245" y="310" width="170" height="100"/>
    <rect x="565" y="410" width="170" height="100"/><rect x="735" y="410" width="170" height="100"/><rect x="905" y="410" width="170" height="100"/><rect x="1075" y="410" width="170" height="100"/><rect x="1245" y="410" width="170" height="100"/>
    <rect x="565" y="510" width="170" height="100"/><rect x="735" y="510" width="170" height="100"/><rect x="905" y="510" width="170" height="100"/><rect x="1075" y="510" width="170" height="100"/><rect x="1245" y="510" width="170" height="100"/>
    <rect x="565" y="610" width="170" height="100"/><rect x="735" y="610" width="170" height="100"/><rect x="905" y="610" width="170" height="100"/><rect x="1075" y="610" width="170" height="100"/><rect x="1245" y="610" width="170" height="100"/>
    <rect x="565" y="710" width="170" height="100"/><rect x="735" y="710" width="170" height="100"/><rect x="905" y="710" width="170" height="100"/><rect x="1075" y="710" width="170" height="100"/><rect x="1245" y="710" width="170" height="100"/>
  </g>

  <!-- White diagonal cells are direct target-specific baselines, not a colour-scale value. -->
  <g fill="#ffffff" stroke="#b9c3ce" stroke-width="3">
    <rect x="565" y="310" width="170" height="100"/><rect x="735" y="410" width="170" height="100"/><rect x="905" y="510" width="170" height="100"/><rect x="1075" y="610" width="170" height="100"/><rect x="1245" y="710" width="170" height="100"/>
  </g>
  <g class="cellDark" text-anchor="middle"><text x="650" y="371">91.0</text><text x="820" y="471">90.0</text><text x="990" y="571">89.0</text><text x="1160" y="671">92.0</text><text x="1330" y="771">87.0</text></g>

  <!-- Absolute accuracy of source-trained decoders on target data. -->
  <g stroke="#ffffff" stroke-width="6">
    <rect x="735" y="310" width="170" height="100" fill="#e36c5c"/><rect x="905" y="310" width="170" height="100" fill="#e77d6c"/><rect x="1075" y="310" width="170" height="100" fill="#e98a78"/>
    <rect x="565" y="410" width="170" height="100" fill="#df5c4d"/><rect x="905" y="410" width="170" height="100" fill="#e67463"/><rect x="1075" y="410" width="170" height="100" fill="#e67a6a"/>
    <rect x="565" y="510" width="170" height="100" fill="#e57060"/><rect x="735" y="510" width="170" height="100" fill="#e57060"/><rect x="1075" y="510" width="170" height="100" fill="#e98f7e"/>
    <rect x="565" y="610" width="170" height="100" fill="#d7473e"/><rect x="735" y="610" width="170" height="100" fill="#de5748"/><rect x="905" y="610" width="170" height="100" fill="#e16555"/><rect x="1245" y="610" width="170" height="100" fill="#f0b2a5"/>
    <rect x="1075" y="710" width="170" height="100" fill="#efaa9b"/>
  </g>
  <g class="cell" text-anchor="middle">
    <text x="820" y="371">80.9</text><text x="990" y="371">78.6</text><text x="1160" y="371">77.3</text>
    <text x="650" y="471">83.2</text><text x="990" y="471">79.4</text><text x="1160" y="471">78.9</text>
    <text x="650" y="571">80.2</text><text x="820" y="571">80.1</text><text x="1160" y="571">76.8</text>
    <text x="650" y="671">85.8</text><text x="820" y="671">83.6</text><text x="990" y="671">81.7</text><text x="1330" y="671">68.5</text>
    <text x="1160" y="771">70.1</text>
  </g>

  <!-- Comparisons not available in this design. -->
  <g class="small" text-anchor="middle"><text x="1330" y="371">—</text><text x="1330" y="471">—</text><text x="1330" y="571">—</text><text x="650" y="771">—</text><text x="820" y="771">—</text><text x="990" y="771">—</text></g>

  <!-- Summary columns use differences (Δ BA), unlike the absolute values in the main matrix. -->
  <line x1="1490" y1="246" x2="1490" y2="818" stroke="#d6dde3" stroke-width="2"/>
  <g stroke="#ffffff" stroke-width="6">
    <rect x="1510" y="310" width="280" height="100" fill="#e6edf3"/><rect x="1790" y="310" width="280" height="100" fill="#d9e3ec"/>
    <rect x="1510" y="410" width="280" height="100" fill="#e6edf3"/><rect x="1790" y="410" width="280" height="100" fill="#d9e3ec"/>
    <rect x="1510" y="510" width="280" height="100" fill="#e6edf3"/><rect x="1790" y="510" width="280" height="100" fill="#d9e3ec"/>
    <rect x="1510" y="610" width="280" height="100" fill="#f2f4f6"/><rect x="1790" y="610" width="280" height="100" fill="#d9e3ec"/>
    <rect x="1510" y="710" width="280" height="100" fill="#f2f4f6"/><rect x="1790" y="710" width="280" height="100" fill="#d9e3ec"/>
  </g>
  <g class="cellDark" text-anchor="middle"><text x="1650" y="371">−9.8</text><text x="1930" y="371">−14.7</text><text x="1650" y="471">−8.7</text><text x="1930" y="471">−13.1</text><text x="1650" y="571">−10.4</text><text x="1930" y="571">−15.2</text><text x="1650" y="671">—</text><text x="1930" y="671">−9.4</text><text x="1650" y="771">—</text><text x="1930" y="771">−16.9</text></g>

  <!-- Sequential scale for absolute balanced accuracy: 0–100%. -->
  <rect x="1435" y="310" width="22" height="500" rx="3" fill="url(#scale)"/>
  <g class="small"><text x="1467" y="326">100</text><text x="1467" y="451">75</text><text x="1467" y="576">50</text><text x="1467" y="701">25</text><text x="1467" y="810">0</text></g>

</svg>
