<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="760" viewBox="0 0 1300 760" role="img" aria-describedby="desc">
  <desc id="desc">A design mockup with Dataset A and Dataset B panels. The horizontal axis is the validation protocol. Coloured lines connect each decoder's values across protocols, and black points and lines show the minimum. Values are illustrative only.</desc>
  <style>
    .panel { font: 700 20px Arial, sans-serif; fill: #172B4D; }
    .axislabel { font: 700 15px Arial, sans-serif; fill: #24354F; }
    .tick { font: 13px Arial, sans-serif; fill: #52657E; }
    .note { font: 13px Arial, sans-serif; fill: #52657E; }
    .axis { stroke: #344054; stroke-width: 1.3; }
    .grid { stroke: #D0D5DD; stroke-width: 1; }
    .model { fill: none; stroke-width: 2.2; stroke-linecap: round; opacity: .72; }
    .mean { fill: none; stroke: #1F2937; stroke-width: 3.4; stroke-linecap: round; }
    .interval { stroke: #1F2937; stroke-width: 2.2; stroke-linecap: round; }
  </style>

  <rect width="1300" height="760" fill="#FFFFFF"/>
  <g transform="translate(0 -70)">
  <!-- Dataset A panel -->
  <text x="80" y="157" class="panel">Dataset A</text>
  <text x="80" y="181" class="note">Full A composition</text>
  <line x1="135" y1="560" x2="595" y2="560" class="axis"/>
  <line x1="135" y1="210" x2="135" y2="560" class="axis"/>
  <line x1="135" y1="490" x2="595" y2="490" class="grid"/>
  <line x1="135" y1="420" x2="595" y2="420" class="grid"/>
  <line x1="135" y1="350" x2="595" y2="350" class="grid"/>
  <line x1="135" y1="280" x2="595" y2="280" class="grid"/>
  <line x1="135" y1="210" x2="595" y2="210" class="grid"/>
  <text x="95" y="564" class="tick">0.50</text><text x="95" y="494" class="tick">0.55</text><text x="95" y="424" class="tick">0.60</text><text x="95" y="354" class="tick">0.65</text><text x="95" y="284" class="tick">0.70</text><text x="95" y="214" class="tick">0.75</text>
  <text x="178" y="590" class="axislabel">Baseline</text>
  <text x="322" y="590" class="axislabel">Cross-subject</text>
  <text x="477" y="590" class="axislabel">Cross-session</text>

  <!-- Five model trajectories: baseline / subject / session -->
  <polyline points="220,364 390,378 540,378" class="model" stroke="#1F77B4"/>
  <polyline points="220,336 390,350 540,364" class="model" stroke="#FF7F0E"/>
  <polyline points="220,350 390,350 540,392" class="model" stroke="#D62728"/>
  <polyline points="220,350 390,322 540,350" class="model" stroke="#9467BD"/>
  <polyline points="220,364 390,364 540,350" class="model" stroke="#2CA02C"/>
  <g opacity=".82"><circle cx="220" cy="364" r="6" fill="#1F77B4"/><circle cx="390" cy="378" r="6" fill="#1F77B4"/><circle cx="540" cy="378" r="6" fill="#1F77B4"/>
  <circle cx="220" cy="336" r="6" fill="#FF7F0E"/><circle cx="390" cy="350" r="6" fill="#FF7F0E"/><circle cx="540" cy="364" r="6" fill="#FF7F0E"/>
  <circle cx="220" cy="350" r="6" fill="#D62728"/><circle cx="390" cy="350" r="6" fill="#D62728"/><circle cx="540" cy="392" r="6" fill="#D62728"/>
  <circle cx="220" cy="350" r="6" fill="#9467BD"/><circle cx="390" cy="322" r="6" fill="#9467BD"/><circle cx="540" cy="350" r="6" fill="#9467BD"/>
  <circle cx="220" cy="364" r="6" fill="#2CA02C"/><circle cx="390" cy="364" r="6" fill="#2CA02C"/><circle cx="540" cy="350" r="6" fill="#2CA02C"/></g>
  <!-- Minimum and illustrative confidence intervals -->
  <polyline points="220,353 390,356 540,367" class="mean"/>
  <g class="interval">
    <line x1="220" y1="338" x2="220" y2="368"/><line x1="210" y1="338" x2="230" y2="338"/><line x1="210" y1="368" x2="230" y2="368"/>
    <line x1="390" y1="338" x2="390" y2="374"/><line x1="380" y1="338" x2="400" y2="338"/><line x1="380" y1="374" x2="400" y2="374"/>
    <line x1="540" y1="344" x2="540" y2="390"/><line x1="530" y1="344" x2="550" y2="344"/><line x1="530" y1="390" x2="550" y2="390"/>
  </g>
  <circle cx="220" cy="353" r="10" fill="#1F2937" stroke="#FFFFFF" stroke-width="2"/><circle cx="390" cy="356" r="10" fill="#1F2937" stroke="#FFFFFF" stroke-width="2"/><circle cx="540" cy="367" r="10" fill="#1F2937" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Dataset B panel -->
  <text x="695" y="157" class="panel">Dataset B</text>
  <text x="695" y="181" class="note">Full B composition</text>
  <line x1="750" y1="560" x2="1210" y2="560" class="axis"/>
  <line x1="750" y1="210" x2="750" y2="560" class="axis"/>
  <line x1="750" y1="490" x2="1210" y2="490" class="grid"/>
  <line x1="750" y1="420" x2="1210" y2="420" class="grid"/>
  <line x1="750" y1="350" x2="1210" y2="350" class="grid"/>
  <line x1="750" y1="280" x2="1210" y2="280" class="grid"/>
  <line x1="750" y1="210" x2="1210" y2="210" class="grid"/>
  <text x="710" y="564" class="tick">0.50</text><text x="710" y="494" class="tick">0.55</text><text x="710" y="424" class="tick">0.60</text><text x="710" y="354" class="tick">0.65</text><text x="710" y="284" class="tick">0.70</text><text x="710" y="214" class="tick">0.75</text>
  <text x="793" y="590" class="axislabel">Baseline</text>
  <text x="937" y="590" class="axislabel">Cross-subject</text>
  <!-- Model trajectories, two available values -->
  <polyline points="835,308 1005,336" class="model" stroke="#1F77B4"/><polyline points="835,308 1005,350" class="model" stroke="#FF7F0E"/>
  <polyline points="835,322 1005,322" class="model" stroke="#D62728"/><polyline points="835,280 1005,336" class="model" stroke="#9467BD"/>
  <polyline points="835,308 1005,294" class="model" stroke="#2CA02C"/>
  <g opacity=".82"><circle cx="835" cy="308" r="6" fill="#1F77B4"/><circle cx="1005" cy="336" r="6" fill="#1F77B4"/>
  <circle cx="835" cy="308" r="6" fill="#FF7F0E"/><circle cx="1005" cy="350" r="6" fill="#FF7F0E"/>
  <circle cx="835" cy="322" r="6" fill="#D62728"/><circle cx="1005" cy="322" r="6" fill="#D62728"/>
  <circle cx="835" cy="280" r="6" fill="#9467BD"/><circle cx="1005" cy="336" r="6" fill="#9467BD"/>
  <circle cx="835" cy="308" r="6" fill="#2CA02C"/><circle cx="1005" cy="294" r="6" fill="#2CA02C"/></g>
  <polyline points="835,305 1005,328" class="mean"/>
  <g class="interval">
    <line x1="835" y1="280" x2="835" y2="330"/><line x1="825" y1="280" x2="845" y2="280"/><line x1="825" y1="330" x2="845" y2="330"/>
    <line x1="1005" y1="300" x2="1005" y2="356"/><line x1="995" y1="300" x2="1015" y2="300"/><line x1="995" y1="356" x2="1015" y2="356"/>
  </g>
  <circle cx="835" cy="305" r="10" fill="#1F2937" stroke="#FFFFFF" stroke-width="2"/><circle cx="1005" cy="328" r="10" fill="#1F2937" stroke="#FFFFFF" stroke-width="2"/>
  </g>
  <!-- Shared legend -->
  <line x1="60" y1="688" x2="86" y2="688" class="model" stroke="#1F77B4"/><text x="94" y="693" class="note">Logistic regression</text>
  <line x1="215" y1="688" x2="241" y2="688" class="model" stroke="#FF7F0E"/><text x="249" y="693" class="note">XGBoost</text>
  <line x1="337" y1="688" x2="363" y2="688" class="model" stroke="#D62728"/><text x="371" y="693" class="note">EEGNet</text>
  <line x1="460" y1="688" x2="486" y2="688" class="model" stroke="#9467BD"/><text x="494" y="693" class="note">ShallowNet</text>
  <line x1="610" y1="688" x2="636" y2="688" class="model" stroke="#2CA02C"/><text x="644" y="693" class="note">EEGConformer</text>
  <circle cx="820" cy="688" r="9" fill="#1F2937" stroke="#FFFFFF" stroke-width="2"/><text x="835" y="693" class="note">min</text>
  <g class="interval"><line x1="1020" y1="674" x2="1020" y2="702"/><line x1="1010" y1="674" x2="1030" y2="674"/><line x1="1010" y1="702" x2="1030" y2="702"/></g><text x="1042" y="693" class="note">paired 95% bootstrap interval</text>
</svg>
