# Датасет Stroop. Всё содержимое файла уходит в config.py как есть.

# --- пути ---
bids_root:  /home/claude/bids_stroop
deriv_root: ${.bids_root}/derivatives/mne-bids-pipeline
task: stroop

# --- каналы и монтаж ---
ch_types: [eeg]
eeg_reference: average
eeg_template_montage: standard_1020

# --- фильтрация ---
l_freq: 1.0
h_freq: 100.0
notch_freq: 50.0
raw_resample_sfreq: 250.0

# --- ICA + ICLabel (значения связаны, менять только вместе) ---
spatial_filter: ica
ica_algorithm: picard-extended_infomax
ica_l_freq: 1.0
ica_h_freq: 100.0
ica_n_components: 0.99
ica_use_icalabel: true
ica_icalabel_include: [brain, other]
ica_exclusion_thresholds:
  muscle artifact: 0.7
  eye blink: 0.7
  heart beat: 0.8
  line noise: 0.8
  channel noise: 0.8

# --- эпохи ---
conditions: ["congruent", "incongruent"]
epochs_tmin: -0.2
epochs_tmax: 0.8
reject: autoreject_global
contrasts:
  - ["incongruent", "congruent"]

# --- декодирование ---
decode: true
decoding_metric: roc_auc
decoding_n_splits: 3

n_jobs: 1
